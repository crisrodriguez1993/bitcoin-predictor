# Configuration file for Bitcoin Predictor System
# Master's Thesis - Universidad San Francisco de Quito (USFQ)
# Author: Cristian Rodríguez - 2025

# Data Sources Configuration
data_sources:
  binance:
    base_url: "https://api.binance.com/api/v3"
    symbol: "BTCUSDT"
    intervals: ["1h", "4h", "1d"]
    limit: 1000  # Maximum number of candles per request
    
  yahoo_finance:
    symbol: "BTC-USD"
    period: "2y"  # Maximum period for historical data
    interval: "1h"  # 1m, 2m, 5m, 15m, 30m, 60m, 90m, 1h, 1d, 5d, 1wk, 1mo, 3mo
    
  coingecko:
    base_url: "https://api.coingecko.com/api/v3"
    coin_id: "bitcoin"
    vs_currency: "usd"
    days: 365  # Number of days of historical data

# Data Storage Configuration
storage:
  bronze_path: "../../data/bronze/"
  silver_path: "../../data/silver/"
  gold_path: "../../data/gold/"
  
# Data Quality Configuration
data_quality:
  required_columns: ["timestamp", "open", "high", "low", "close", "volume"]
  timestamp_format: "%Y-%m-%d %H:%M:%S"
  timezone: "UTC"
  
# Rate Limiting Configuration
rate_limits:
  binance_requests_per_minute: 1200
  yahoo_requests_per_hour: 2000
  coingecko_requests_per_minute: 10
  
# Logging Configuration
logging:
  level: "INFO"
  format: "[%(asctime)s] %(levelname)s - %(message)s"
